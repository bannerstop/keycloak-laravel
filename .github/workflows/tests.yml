name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.3'
            require: 'orchestra/testbench:^4.0 php-http/guzzle6-adapter:^2.0'
          - php: '8.1'
            require: 'orchestra/testbench:^6.0'
    steps:
      - uses: actions/checkout@v4
      - name: Start Keycloak
        run: |
          curl -sSfo realm.json https://raw.githubusercontent.com/bannerstop/keycloak/main/tests-e2e/realm.json
          docker run -d --name keycloak -p 8080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/realm.json:/opt/keycloak/data/import/realm.json:ro" \
            quay.io/keycloak/keycloak:26.4 start-dev --import-realm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev --no-update ${{ matrix.require }}
      - run: composer update --no-interaction --no-progress
      - name: Wait for Keycloak
        run: timeout 120 bash -c 'until curl -sf http://localhost:8080/realms/example/.well-known/openid-configuration; do sleep 2; done' > /dev/null
      - run: vendor/bin/phpunit
        env:
          KEYCLOAK_URL: http://localhost:8080
